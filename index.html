<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undian Wawancara Pertanian Jepang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
            50% { box-shadow: 0 0 30px rgba(20, 184, 166, 0.35); }
        }
        .slot-glow {
            animation: pulse-glow 3s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <header class="w-full max-w-2xl mx-auto text-center pt-4 pb-2">
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">
            Undian Wawancara <span class="text-teal-400">Pertanian Jepang</span>
        </h1>
    </header>

    <main class="w-full max-w-2xl mx-auto flex flex-col gap-4 my-auto">
        
        <!-- Slot Box & Result Combined Container -->
        <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-center">
            
            <!-- Left Box: Spin Control -->
            <div class="sm:col-span-5 flex flex-col items-center justify-center">
                <div class="w-full bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl slot-glow relative overflow-hidden flex flex-col items-center text-center">
                    
                    <!-- Number Display -->
                    <div id="slotNumber" class="text-5xl sm:text-6xl font-black my-1 text-teal-400 transition-all duration-300">
                        --
                    </div>

                    <div id="remainingCount" class="text-xs text-slate-400 mb-4 font-medium">Sisa: 33 soal</div>

                    <!-- Action Controls -->
                    <div class="flex gap-2 w-full">
                        <button onclick="startDraw()" id="actionSpinBtn" class="flex-1 bg-gradient-to-r from-indigo-600 to-teal-500 hover:from-indigo-500 hover:to-teal-400 text-white font-bold py-2.5 px-4 rounded-xl shadow transition transform active:scale-95 flex items-center justify-center gap-1.5 cursor-pointer text-xs sm:text-sm">
                            Mulai
                        </button>
                        <button onclick="resetWheel()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-semibold py-2.5 px-3.5 rounded-xl shadow transition active:scale-95 flex items-center justify-center cursor-pointer text-xs sm:text-sm" title="Reset">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Box: Result Display -->
            <div class="sm:col-span-7 bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl flex flex-col justify-between min-h-[140px] sm:min-h-[160px]">
                <div>
                    <h2 id="resultTitle" class="text-sm sm:text-base font-semibold text-slate-100 leading-snug">
                        Tekan tombol "Mulai" untuk mengundi pertanyaan.
                    </h2>
                </div>

                <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-end">
                    <button onclick="copyQuestion()" id="copyBtn" class="hidden text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1 transition cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        Salin
                    </button>
                </div>
            </div>

        </div>

        <div class="bg-slate-900/50 border border-slate-800/80 p-3.5 rounded-xl">
            <h3 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Riwayat (<span id="historyCount">0</span>)</h3>
            <div id="historyList" class="max-h-24 overflow-y-auto space-y-1.5 text-xs text-slate-300 pr-1">
                <p class="text-slate-500 italic">Belum ada riwayat.</p>
            </div>
        </div>

    </main>

    <script>
        // Full database of 33 agricultural interview questions
        const originalQuestions = [
            "1. JIKOSHOKAI",
            "2. Doushite nihon de nougyou ga shitai no desu ka?",
            "3. Kono kaisha ni okyoumi o motta riyuu wa nan desu ka?",
            "4. Hoka no hito dewa naku, naze anata o saiyou subeki na no desu ka?",
            "5. Anata no chousho wa nan desu ka?",
            "6. Anata no tansho wa nan desu ka?",
            "7. Tokuina koto wa nan desu ka?",
            "8. Tairyoku ni jishin wa arimasu ka?",
            "9. Nihon de nannen hatarakemasu ka?",
            "10. Nihongo kentei wa doko made torimasu ka? Mokuhyou o itte kudasai.",
            "11. Nihon ni kite nani o shitai desu ka? Shigoto de charenji shite mitai koto wa nan desu ka?",
            "12. Indoneshia ni kaette nani ga shitai desu ka? Shourai no yume wa nan desu ka?",
            "13. Hai kurai no okane ga kakarimasu ka?",
            "14. Maitsuki ikura chochiku shimasu ka? Shiokuri wa shimasu ka?",
            "15. Nougyou no shigoto de donna koto o shite imashita ka?",
            "16. Jibun de sodateru yasai ya ine nado no saibai de taihen datta koto wa nan desu ka? Sono toki, dono you ni taisaku shimashita ka?",
            "17. Nougyou o shite ite tanoshikatta koto wa nan desu ka?",
            "18. Zenshoku o oshiete kudasai. Kyuuryou wa ikura deshita ka? Nanji kara nanji made hatarakimashita ka?",
            "19. Kuruma no unten menkyo wa motte imasu ka?",
            "20. Iku ya kikai no shuuuri wa dekimasu ka?",
            "21. Ichi-nichi ni nanbon tabako o suimasu ka?",
            "22. Ude tate fushi o shite kudasai.",
            "23. Geemu wa ichi-nichi ni nanjikan kurai shimasu ka?",
            "24. Omotai mono de wa donna mono o motte imashita ka? Nani ga ichiban omotakatta desu ka?",
            "25. Nan-kiro made motsu koto ga dekimasu ka?",
            "26. Ramukyou no oinori wa shimasu ka?",
            "27. Ryouri wa dekimasu ka?",
            "28. Gokazoku wa nani o shite imasu ka?",
            "29. Shigoto ya ryou de mondai ga attara dou shimasu ka?",
            "30. Shigoto de wakaranai koto ga attara dou shimasu ka?",
            "31. Shachou wa, anata ni jibun no katate to naru riidaa ni natte hoshii to kangaete imasu. Ima iru senpai ni taishite, hitsuyou de areba chuui dekimasu ka?",
            "32. Shigoto ga mada nokotte imasu. Shikashi shachou wa kaisha ni imasen. Sono toki, hoka no shain ni shigoto o tsuzukeru you ni iimasu ka? Sore tomo shachou ni renraku shimasu ka?",
            "33. Nanika shitsumon wa arimasu ka?"
        ];

        let activeQuestions = [...originalQuestions];
        let history = [];
        let isDrawing = false;

        function startDraw() {
            if (isDrawing) return;
            if (activeQuestions.length === 0) {
                document.getElementById('resultTitle').innerText = "Semua soal sudah habis! Silakan reset.";
                return;
            }

            isDrawing = true;
            document.getElementById('actionSpinBtn').disabled = true;

            let counter = 0;
            const maxCount = 15;
            const slotEl = document.getElementById('slotNumber');

            const rollInterval = setInterval(() => {
                const randomTempIndex = Math.floor(Math.random() * activeQuestions.length);
                const tempNum = activeQuestions[randomTempIndex].split('.')[0];
                slotEl.innerText = tempNum;
                counter++;

                if (counter >= maxCount) {
                    clearInterval(rollInterval);
                    finalizeDraw();
                }
            }, 60);
        }

        function finalizeDraw() {
            const selectedIndex = Math.floor(Math.random() * activeQuestions.length);
            const selectedQuestion = activeQuestions[selectedIndex];
            const questionNumOnly = selectedQuestion.split('.')[0];
            
            document.getElementById('slotNumber').innerText = questionNumOnly;
            document.getElementById('resultTitle').innerText = selectedQuestion;
            document.getElementById('copyBtn').classList.remove('hidden');

            activeQuestions.splice(selectedIndex, 1);
            history.unshift(selectedQuestion);
            updateHistoryUI();
            updateRemainingCount();

            isDrawing = false;
            document.getElementById('actionSpinBtn').disabled = false;
        }

        function updateHistoryUI() {
            const historyList = document.getElementById('historyList');
            document.getElementById('historyCount').innerText = history.length;

            if (history.length === 0) {
                historyList.innerHTML = `<p class="text-slate-500 italic">Belum ada riwayat.</p>`;
                return;
            }

            historyList.innerHTML = history.map((item, idx) => `
                <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800 flex items-center gap-2">
                    <span class="bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded text-[10px] font-bold">${history.length - idx}</span>
                    <span class="text-slate-200 line-clamp-1">${item}</span>
                </div>
            `).join('');
        }

        function updateRemainingCount() {
            document.getElementById('remainingCount').innerText = `Sisa: ${activeQuestions.length} soal`;
        }

        function resetWheel() {
            if (isDrawing) return;
            activeQuestions = [...originalQuestions];
            history = [];
            document.getElementById('slotNumber').innerText = "--";
            updateHistoryUI();
            updateRemainingCount();
            document.getElementById('resultTitle').innerText = 'Tekan tombol "Mulai" untuk mengundi pertanyaan.';
            document.getElementById('copyBtn').classList.add('hidden');
        }

        function copyQuestion() {
            const text = document.getElementById('resultTitle').innerText;
            if (!text || text.includes('Tekan tombol')) return;
            
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Tersalin!`;
                setTimeout(() => {
                    copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg> Salin`;
                }, 2000);
            } catch (err) {
                console.error('Gagal menyalin teks', err);
            }
            document.body.removeChild(textArea);
        }

        window.onload = function() {
            updateRemainingCount();
        };
    </script>
</body>
</html>
